# gitleaks configuration for wata-board.
# Extends the default ruleset with allowlists for test/example content.

[extend]
useDefault = true

# Allowlist of paths known to contain example/test secrets (not real secrets).
[allowlist]
description = "Ignore test fixtures, examples, and obvious placeholders"
paths = [
  '''security-tests/.*''',
  '''backend/src/test/.*''',
  '''backend/src/__tests__/.*''',
  '''backend/tests/.*''',
  '''frontend/src/test/.*''',
  '''frontend/src/__tests__/.*''',
  '''contract/src/.*''',
  '''contract/nepa_contract/src/.*''',
  '''.env.example''',
  '''backend/.env.example''',
  '''backend/api-testing/.*''',
  '''docs/.*''',
]
regexes = [
  '''example-password''',
  '''change-me''',
  '''YOUR_.*_HERE''',
  '''gho_\*+''',
  '''localhost:[0-9]+''',
  '''127\.0\.0\.1:[0-9]+''',
  '''SABER[0-9a-f]+''',
  '''SBJZL[0-9A-Z]+''',
  '''test_password''',
  '''test_user''',
]
