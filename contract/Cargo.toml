[package]
name = "nepa_contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"] # This tells Rust to compile to WebAssembly

[dependencies]
soroban-sdk = "20.0.0"  # The Stellar Smart Contract SDK

[features]
# Opt-in. The legacy `tests` / `mainnet_tests` modules predate several contract
# API changes (5-arg `pay_bill`, the removed `get_payment_record` getter, ...)
# and do not yet compile. They are excluded from the default `cargo test` build
# and gated here so they can be re-enabled once updated to the current API.
legacy_tests = []

[dev-dependencies]
soroban-sdk = { version = "20.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"         # Optimizes the contract for small size
overflow-checks = true
debug = 0
strip = "symbols"