# cargo-audit configuration for the Soroban smart contract (issue #363).
#
# cargo-audit auto-discovers this file when run from the `contract/` directory
# (locally and in CI via `.github/workflows/comprehensive-tests.yml`). Every
# entry below is a HIGH/CRITICAL advisory that cannot currently be fixed and is
# consciously accepted, with the rationale recorded here and in
# backend/docs/dependency-security.md.
#
# Review trigger: revisit this list on any soroban-sdk upgrade — a move off the
# 20.x line is expected to clear both entries, at which point they must be
# removed so the advisories can gate again.

[advisories]
ignore = [
    # curve25519-dalek timing variability in `Scalar29`/`Scalar52` subtraction.
    # Pulled in transitively by soroban-sdk 20.x: soroban-env-host 20.3.0 hard
    # pins `curve25519-dalek = ">=4.1.1, <=4.1.2"`, so it cannot be bumped to the
    # patched 4.1.3 without upgrading soroban-sdk (20 -> 28, a breaking change).
    # soroban-env-host is host/test tooling and is NOT compiled into the wasm
    # that is deployed on-chain, so the deployed contract is not affected.
    "RUSTSEC-2024-0344",

    # `time` segmentation-fault / UB advisory, reached only through the same
    # soroban-env-host dependency chain (build/test host, not the deployed
    # wasm). Blocked by the same soroban-sdk major-version pin as above.
    "RUSTSEC-2026-0009",
]
